name: view-lag probe

on:
  schedule:
    # GitHub throttles and silently drops scheduled runs, and */5 gets dropped
    # hardest -- observed roughly one run per hour, not twelve. So the schedule is
    # now just a restart trigger: each run HOLDS the runner for 50 minutes and
    # samples on its own clock. The concurrency group keeps at most one run and
    # one pending run, so a finished hold is picked straight up by the next
    # trigger and coverage stays continuous.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to hold and tick (0 = single poll)"
        default: "50"
      tick_seconds:
        description: "Seconds between ticks"
        default: "60"

concurrency:
  group: probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Poll and hold
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOOKBACK_DAYS: "12"
          TOP_N: "20"
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '50' }}
          TICK_SECONDS: ${{ github.event.inputs.tick_seconds || '60' }}
        run: python3 poll.py

      # always() so a cancelled or failed run still commits the ticks it collected
      - name: Commit log
        if: always()
        run: |
          git config user.name  "view-lag probe"
          git config user.email "probe@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "probe $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
